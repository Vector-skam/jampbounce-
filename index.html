<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Bounce Ultra - Auto Spawn</title>
    <style>
        body {
            margin: 0; overflow: hidden; background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; touch-action: none;
        }
        canvas { display: block; }
        
        /* Интерфейс */
        #ui {
            position: absolute; top: 20px; left: 20px; color: #333;
            pointer-events: none; display: none; z-index: 5;
        }
        .stat { font-size: 24px; font-weight: bold; margin-bottom: 5px; text-shadow: 1px 1px 0 white; }
        
        /* Меню и Экраны */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: rgba(255,255,255,0.95); z-index: 10;
        }
        h1 { font-size: 48px; color: #3498db; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 18px; color: #666; margin-bottom: 20px; }
        .mode-container { display: flex; gap: 20px; margin-top: 20px; }
        
        button {
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            color: white; background: #3498db; border: none;
            border-radius: 15px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 0 #2980b9;
        }
        button:hover { background: #2980b9; transform: translateY(-2px); box-shadow: 0 6px 0 #2471a3; }
        button:active { transform: translateY(2px); box-shadow: 0 0 0 #2471a3; }
        button.alt { background: #9b59b6; box-shadow: 0 4px 0 #8e44ad; }
        button.alt:hover { background: #8e44ad; box-shadow: 0 6px 0 #71368a; }
        
        #timer-display, #lives-display { color: #e67e22; }
    </style>
</head>
<body>

<div id="start-menu" class="overlay">
    <h1>Emoji Bounce</h1>
    <p>Толкай мяч кликом мышки!</p>
    <div class="mode-container">
        <button onclick="startGame('time')">Сбор на время (60с)</button>
        <button class="alt" onclick="startGame('lives')">3 Жизни (Выживание)</button>
    </div>
</div>

<div id="game-over" class="overlay" style="display: none;">
    <h1 id="over-title">Игра окончена!</h1>
    <p id="final-score">Твой счет: 0</p>
    <button onclick="backToMenu()">В ГЛАВНОЕ МЕНЮ</button>
</div>

<div id="ui">
    <div class="stat">СЧЕТ: <span id="score">0</span></div>
    <div id="mode-stat" class="stat"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const STATES = { MENU: 0, PLAYING: 1, OVER: 2 };
let currentState = STATES.MENU;
let gameMode = 'time';

let score = 0;
let timeLeft = 60;
let lives = 3;
let timerInterval;
let autoSpawnInterval;

const ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 22, color: '#3498db' };
let emojis = [];
const floorPadding = 80;
const gravity = 0.25;
const friction = 0.985;
let stopTimer = 0;

function playSound(f, type = 'square') {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    o.start(); o.stop(audioCtx.currentTime + 0.1);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function spawnEmoji() {
    const margin = 100;
    emojis.push({
        x: Math.random() * (canvas.width - margin * 2) + margin,
        y: Math.random() * (canvas.height - floorPadding - margin) + margin,
        char: ['💎', '⭐', '🔥', '🚀', '🌈', '🍎', '👾', '👑', '⚡', '🍀'][Math.floor(Math.random() * 10)],
        scale: 0,
        targetScale: 1
    });
}

function startGame(mode) {
    gameMode = mode;
    score = 0;
    currentState = STATES.PLAYING;
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.vx = 5; ball.vy = 0;
    emojis = [];
    stopTimer = 0;

    // Начальный набор
    for(let i=0; i<6; i++) spawnEmoji();

    document.getElementById('start-menu').style.display = 'none';
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
    document.getElementById('score').innerText = score;

    // Сброс старых таймеров
    clearInterval(timerInterval);
    clearInterval(autoSpawnInterval);

    // Логика автоматической генерации новых шариков (каждые 3 секунды)
    autoSpawnInterval = setInterval(() => {
        if (currentState === STATES.PLAYING && emojis.length < 22) {
            spawnEmoji();
        }
    }, 500);

    if (mode === 'time') {
        timeLeft = 60;
        updateModeUI(`ВРЕМЯ: ${timeLeft}с`);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateModeUI(`ВРЕМЯ: ${timeLeft}с`);
            if (timeLeft <= 0) endGame("Время вышло!");
        }, 1000);
    } else {
        lives = 3;
        updateModeUI(`ЖИЗНИ: ${"❤️".repeat(lives)}`);
    }
}

function updateModeUI(text) {
    document.getElementById('mode-stat').innerText = text;
}

canvas.addEventListener('mousedown', (e) => {
    if (currentState !== STATES.PLAYING) return;
    
    // Вектор от клика к мячу
    const dx = ball.x - e.clientX;
    const dy = ball.y - e.clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    // Сила толчка зависит от близости клика (чем ближе, тем сильнее)
    const power = 15;
    const angle = Math.atan2(dy, dx);
    ball.vx = Math.cos(angle) * power;
    ball.vy = Math.sin(angle) * power;
    
    playSound(400 + Math.random() * 100);
    stopTimer = 0;
});

function endGame(title) {
    currentState = STATES.OVER;
    clearInterval(timerInterval);
    clearInterval(autoSpawnInterval);
    document.getElementById('game-over').style.display = 'flex';
    document.getElementById('ui').style.display = 'none';
    document.getElementById('over-title').innerText = title;
    document.getElementById('final-score').innerText = "Твой счет: " + score;
}

function backToMenu() {
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('start-menu').style.display = 'flex';
    currentState = STATES.MENU;
}

function update() {
    if (currentState !== STATES.PLAYING) return;

    ball.vy += gravity;
    ball.vx *= friction;
    ball.vy *= friction;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Отскоки от стен
    if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
        ball.vx *= -0.8;
        ball.x = ball.x < ball.radius ? ball.radius : canvas.width - ball.radius;
        playSound(200, 'sine');
    }
    
    const floor = canvas.height - floorPadding;
    if (ball.y + ball.radius > floor) {
        ball.vy *= -0.6;
        ball.y = floor - ball.radius;

        // Если мяч почти остановился на полу
        if (Math.abs(ball.vy) < 1 && Math.abs(ball.vx) < 1) {
            stopTimer++;
            if (gameMode === 'lives' && stopTimer > 60) { 
                lives--;
                playSound(150, 'sawtooth');
                if (lives <= 0) {
                    endGame("Жизни кончились!");
                } else {
                    updateModeUI(`ЖИЗНИ: ${"❤️".repeat(lives)}`);
                    ball.vy = -12; // Авто-подброс при потере жизни
                    stopTimer = 0;
                }
            }
        }
    } else {
        stopTimer = 0;
    }

    // Проверка столкновений с эмодзи
    emojis = emojis.filter(e => {
        const dx = ball.x - e.x;
        const dy = ball.y - (e.y - 10);
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < ball.radius + 25) {
            score += 10;
            document.getElementById('score').innerText = score;
            playSound(800 + (score % 100), 'sine');
            // При сборе одного шарика вручную, сразу спавним новый (помимо автоспавна)
            spawnEmoji();
            return false;
        }
        return true;
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Рисуем пол
    ctx.beginPath();
    ctx.moveTo(0, canvas.height - floorPadding);
    ctx.lineTo(canvas.width, canvas.height - floorPadding);
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 4;
    ctx.stroke();

    if (currentState === STATES.PLAYING) {
        // Отрисовка эмодзи
        emojis.forEach(e => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(e.x, e.y - 10, 25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(240, 240, 240, 0.5)';
            ctx.fill();
            ctx.strokeStyle = '#ddd';
            ctx.stroke();
            
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(e.char, e.x, e.y - 10);
            ctx.restore();
        });

        // Отрисовка мяча
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.color;
        ctx.fill();
        // Блик на мяче
        ctx.beginPath();
        ctx.arc(ball.x - 6, ball.y - 6, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fill();
    }

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

draw();
</script>
</body>
</html>
